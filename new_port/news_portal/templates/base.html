<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}News Portal{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'news:home' %}">Home</a> |  <!-- Добавляем пространство имён 'news' -->
        {% if user.is_authenticated %}
            <a href="{% url 'news:profile' %}">Profile</a> |
            <a href="{% url 'news:post_create' %}">Create Post</a> |
            {% if not user.groups.all|length > 1 %}
                <a href="{% url 'news:become_author' %}">Become Author</a> |
            {% endif %}
            <a href="{% url 'account_logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'account_login' %}">Login</a> |
            <a href="{% url 'account_signup' %}">Sign Up</a>
        {% endif %}
    </nav>
    {% block content %}
    {% endblock %}
</body>
</html>
