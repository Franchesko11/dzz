<!DOCTYPE html>
<html>
<head>
    <title>Главная страница</title>
</head>
<body>
    <h1>Добро пожаловать на News Portal!</h1>
    <p><a href="{% url 'news:post_list' %}">Посмотреть все посты</a></p>
    {% if user.is_authenticated %}
        <p>Привет, {{ user.username }}! <a href="{% url 'account_logout' %}">Выйти</a></p>
        <p><a href="{% url 'news:profile' %}">Редактировать профиль</a></p>
        {% if 'authors' not in user.groups.all %}
            <p><a href="{% url 'news:become_author' %}">Стать автором</a></p>
        {% endif %}
    {% else %}
        <p><a href="{% url 'account_login' %}">Войти</a> | <a href="{% url 'account_signup' %}">Зарегистрироваться</a></p>
    {% endif %}
</body>
</html>
