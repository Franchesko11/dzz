<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
</head>
<body>
    <h2>Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{% url 'account_login' %}">Войти</a></p>

    <!-- Добавляем кнопку для регистрации через Yandex -->
    <h3>Или зарегистрируйтесь через:</h3>
    <a href="{% url 'socialaccount_signup' %}?provider=yandex">Зарегистрироваться через Yandex</a>
</body>
</html>
